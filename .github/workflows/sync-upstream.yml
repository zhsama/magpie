name: Sync upstream

# Merges yetone/magpie's main into this fork's main, checks what the fork
# keeps (.github/fork-check.sh), pushes, and releases the fork at upstream's
# latest version when it isn't out yet (release-fork.yml, in this run: its
# failure fails the run, and a second sync waits for it). When the merge or
# the check fails, nothing is pushed and the run's summary says what to do.

on:
  schedule:
    # daily, 09:17 JST: off the hour, when GitHub drops fewer scheduled runs
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      release: ${{ steps.release.outputs.release }}
    steps:
      # GITHUB_TOKEN may not push a commit that changes .github/workflows,
      # and upstream's main changes them often
      - name: Check the push token
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::error::Set the SYNC_TOKEN secret: a fine-grained token for this repository with Contents and Workflows read and write."
            exit 1
          fi

      # the token that may push stays out of .git/config while upstream's
      # code runs in the check: only the Push step has it
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Merge upstream
        id: merge
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/yetone/magpie.git
          # upstream tags its commits on main: the newest tag before the
          # fetch is on what the fetch brings
          ver=$(git ls-remote --tags --refs upstream 'v*' \
            | awk -F/ '$3 ~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ {print $3}' \
            | sort -V | tail -1)
          ver="${ver#v}"
          [ -n "$ver" ]
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          git fetch --no-tags upstream main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "main is current"
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-edit -m "merge upstream main" upstream/main
          echo "updated=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        if: steps.merge.outputs.updated == 'true'
        with:
          go-version-file: go.mod

      - name: Check what the fork keeps
        id: check
        if: steps.merge.outputs.updated == 'true'
        run: .github/fork-check.sh

      - name: Push
        if: steps.merge.outputs.updated == 'true'
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: git push "https://x-access-token:${SYNC_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main

      # GitHub keeps a workflow on or off by its file: one upstream adds or
      # renames comes in on, and would run here
      - name: Keep only the fork's workflows on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows" --jq '
            .workflows[] | select(.state == "active") | .path
            | select(startswith(".github/workflows/")) | split("/") | last
            | select(IN("test.yml", "macos.yml", "sync-upstream.yml", "release-fork.yml") | not)' \
            | while read -r f; do
                if gh workflow disable "$f" --repo "$GITHUB_REPOSITORY"; then
                  echo "turned off $f" | tee -a "$GITHUB_STEP_SUMMARY"
                else
                  echo "::warning::could not turn off $f"
                fi
              done

      # also when main was current: a release that failed before goes again
      - name: Is upstream's version out here?
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.merge.outputs.version }}
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if out=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json tagName 2>&1); then
            echo "v$VERSION is out already"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif grep -q 'release not found' <<<"$out"; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "$out" >&2
            exit 1
          fi

      - name: Say what to do
        if: failure() && (steps.merge.outcome == 'failure' || steps.check.outcome == 'failure')
        env:
          MERGE: ${{ steps.merge.outcome }}
        run: |
          {
            echo "### Nothing was pushed"
            echo
            conflicts=$(git diff --name-only --diff-filter=U 2>/dev/null || true)
            if [ -n "$conflicts" ]; then
              echo "Merging upstream/main conflicts in:"
              echo
              echo "$conflicts" | sed 's/^/- `/; s/$/`/'
            elif [ "$MERGE" = failure ]; then
              echo "The Merge upstream step failed before merging: see its log."
            else
              echo "The merge went in, but .github/fork-check.sh failed: see its step."
            fi
            echo
            echo "Merge it in your clone, keeping the fork's changes, and run the sync again to release it:"
            echo
            echo '```sh'
            echo 'git switch main && git pull'
            echo 'git fetch --no-tags upstream && git merge --no-commit -m "merge upstream main" upstream/main'
            echo '# resolve and git add, then'
            echo '.github/fork-check.sh && git commit --no-edit && git push'
            echo "gh workflow run sync-upstream.yml --repo $GITHUB_REPOSITORY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: sync
    if: needs.sync.outputs.release == 'true'
    permissions:
      contents: write
      packages: write
    uses: ./.github/workflows/release-fork.yml
    with:
      version: ${{ needs.sync.outputs.version }}
      sha: ${{ needs.sync.outputs.sha }}
